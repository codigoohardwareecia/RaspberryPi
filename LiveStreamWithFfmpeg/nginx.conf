user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Configurações de HLS
            hls on;
            hls_path /var/www/html/stream;
            hls_fragment 1;
            hls_playlist_length  30;
            hls_cleanup on;
            hls_variant _low BANDWIDTH=500000;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 80;
        server_name localhost;

        # Site principal
        location / {
            root /var/www/html;
            index index.html;
        }

        # Entrega dos arquivos do Streaming (HLS)
        location /stream {
            alias /var/www/html/stream;
            
            # Configurações para evitar erro de CORS em players web
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Cache-Control' 'no-cache';
            
            # Tipos de arquivos HLS
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }
}